<title>One-Armed Hunter</title>
<meta name="theme-color" content="#06050a">
<style>
:root { --ink: #06050a; --panel: #14101f; --line: #43365f; --text: #f3e6c9; --dim: #a99cc6; --gold: #f0b648; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); overflow: hidden; font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
#wrap { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
#game { width: 100%; height: 100%; display: block; touch-action: none; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(6, 5, 10, 0.94); display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.overlay::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px); }
#infoBody { flex: 1; min-height: 0; overflow-y: auto; max-width: 560px; width: 100%; margin: 0 auto; font-size: 15px; line-height: 1.5; }
#infoBody h2 { color: var(--gold); margin: 4px 0 6px; font-size: 22px; text-wrap: balance; } #infoBody h3 { color: var(--gold); margin: 22px 0 6px; font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
#infoBody small { color: var(--dim); font-weight: normal; font-size: 12px; } #infoBody p { margin: 6px 0; } .note { color: var(--dim); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; } td, th { padding: 4px 6px; border-bottom: 1px solid #2a2140; text-align: right; } td:first-child, th:first-child { text-align: left; }
.hist { font-size: 13px; } .sym { width: 34px; height: 34px; image-rendering: pixelated; vertical-align: middle; }
.lines { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; font-family: monospace; font-size: 11px; line-height: 1; } .line span { display: block; letter-spacing: 1px; color: var(--gold); } .line b { display: block; color: var(--dim); margin-bottom: 2px; }
.set { display: grid; gap: 10px; } .set label { display: flex; align-items: center; gap: 8px; } .set input[type=range] { flex: 1; }
button, select { font: inherit; color: var(--text); background: #2b2242; border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#infoClose, .big { background: var(--gold); color: #120e1c; border: 0; font-weight: bold; margin: 10px auto 0; width: 100%; max-width: 560px; position: relative; z-index: 1; }
#check { justify-content: center; text-align: center; gap: 14px; } #check p { max-width: 36ch; margin: 0 auto; font-size: 17px; line-height: 1.5; }
</style>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="fail" hidden><p>Loading failed.</p></div>
<div id="info" class="overlay" hidden><div id="infoBody"></div><button id="infoClose">Back to the game</button></div>
<script>/*__BUNDLE__*/</script>
