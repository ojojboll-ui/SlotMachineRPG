  function chest(open) {
    return sculpt(48, 48, (c) => {
      const wood = lin(c, 0, 20, 0, 46, ["#6a3e1e", "#3a2010"]);
      c.fillStyle = wood;
      c.fillRect(6, 24, 36, 22);
      if (!open) {
        poly(c, [6, 24, 8, 14, 40, 14, 42, 24], lin(c, 0, 12, 0, 24, ["#7a4a24", "#4a2a14"]));
      } else {
        poly(c, [6, 24, 4, 8, 44, 8, 42, 24], "#2a160a");
        c.fillStyle = "#120804";
        c.fillRect(8, 22, 32, 4);
      }
      c.fillStyle = "#3a3a44";
      for (const x of [10, 36]) c.fillRect(x, open ? 8 : 14, 3, 32 + (open ? 6 : 0));
      c.fillStyle = "#c89a3a";
      c.fillRect(22, 26, 5, 6);
    }, open ? (c) => {
      c.fillStyle = "rgba(240,190,80,1)";
      c.fillRect(10, 21, 28, 2);
    } : null);
  }

      text(ctx, "A DUNGEON CRAWL ON FIVE REELS", VW / 2, 94, DIM, { align: "center" });
      const y = H2 / 2 + 20;
      const lines = ["Walk the maze for free.", "Every fight and every chest", "is a spin of the reels.", "", "Find the keys. Kill what guards", "the way out. Three realms."];
      lines.forEach((l, i) => text(ctx, l, VW / 2, y + i * 10, TEXT, { align: "center" }));
      if ((now / 500 | 0) % 2) text(ctx, run ? "TAP TO CONTINUE" : "TAP TO BEGIN", VW / 2, H2 - 70, GOLD, { align: "center", scale: 2 });
      text(ctx, "CREDIT " + fmt2(wallet.balance), VW / 2, H2 - 40, TEXT, { align: "center" });
      text(ctx, "DEMO PLAY - NO REAL MONEY - RTP 96.00%", VW / 2, H2 - 24, "#6a5a8e", { align: "center" });
      text(ctx, "ARROWS/WASD MOVE  SPACE ATTACK  H MEDKIT", VW / 2, H2 - 12, "#4a3a6e", { align: "center" });
    }
    const spriteCanvases = {};
    const toCanvasCached = (k) => spriteCanvases[k] || (spriteCanvases[k] = toCanvas(SPR[k].img));
    function drawIntro() {
      const L = run.level, r = L.realm;
      ctx.fillStyle = "rgba(6,5,10,0.94)";
      ctx.fillRect(0, 0, VW, H2);
      text(ctx, r.sub, VW / 2, 70, DIM, { align: "center" });
      text(ctx, r.name, VW / 2, 86, GOLD, { align: "center", scale: 2 });
      wrap2(r.intro, 200).forEach((l, i) => text(ctx, l, VW / 2, 120 + i * 11, TEXT, { align: "center" }));
      wrap2("Find the brass key, then the bone key. Both lie in chests, and opening one is a spin. The guardian of the way out waits at the end.", 210).forEach((l, i) => text(ctx, l, VW / 2, 190 + i * 11, DIM, { align: "center" }));
      if ((now / 500 | 0) % 2) text(ctx, "TAP TO ENTER", VW / 2, H2 - 60, GOLD, { align: "center", scale: 2 });
    }
    function drawEnd() {
      const won = scene === "won";
      ctx.fillStyle = won ? "rgba(10,6,4,0.9)" : "rgba(20,0,4,0.88)";
      ctx.fillRect(0, 0, VW, H2);
      text(ctx, won ? "THE SEAL HOLDS" : "YOU DIED", VW / 2, 70, won ? GOLD : RED, { align: "center", scale: 2 });
      const st = run.stats;
      const rows = [["Realm", REALMS[run.realm].name], ["Kills", st.kills], ["Chests", st.chests], ["Spins", st.spins], ["Damage dealt", st.dealt], ["Damage taken", st.taken], ["Steps", st.steps]];
      rows.forEach(([k, v], i) => {
        text(ctx, k, 40, 110 + i * 12, DIM);
        text(ctx, String(v), VW - 40, 110 + i * 12, TEXT, { align: "right" });
      });
      text(ctx, "Credits are kept between runs.", VW / 2, 210, DIM, { align: "center" });
      if ((now / 500 | 0) % 2) text(ctx, "TAP TO BEGIN AGAIN", VW / 2, H2 - 60, GOLD, { align: "center", scale: 2 });
    }
    audio.build();
    if (run) {
      setupRealm();
    }
    window.addEventListener("beforeunload", () => {
      saveWallet();
      saveRun();
    });
    requestAnimationFrame(frame);
    window.__hunter = { G: game_exports, get run() {
      return run;
    }, get wallet() {
      return wallet;
    }, act, get busy() {
      return busy;
    }, setup: () => {
      reveal(run);
      setupRealm();
    }, goto: (r) => {
      run.realm = r;
      enterRealm(run);
      setupRealm();
    } };
  }

  // src/main.js
  try {
    startApp();
  } catch (e) {
    console.error(e);
    const f = document.getElementById("fail");
    f.hidden = false;
    f.querySelector("p").textContent = "The game could not start: " + e.message;
  }
})();
</script>
</body>
</html>
